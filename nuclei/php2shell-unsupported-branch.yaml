id: php2shell-unsupported-branch

info:
  name: PHP PHP2Shell Unsupported Branch - Passive Detect
  author: scanfactory
  severity: info
  description: |
    Passively identifies a disclosed PHP 5.4-5.6, 7.x, 8.0, or 8.1 version.
    These upstream branches are unsupported and require an upgrade or verified
    vendor/source backport assessment for CVE-2026-109618 and CVE-2026-109619.
    A version banner is not proof that the responding web runtime is exploitable.
  remediation: |
    Upgrade to a supported fixed PHP branch or verify a vendor/source backport
    using package-level evidence from the runtime serving the web request.
  reference:
    - https://www.php.net/archive/2026.php#2026-10-21-5
    - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
    - https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
  classification:
    cve-id:
      - CVE-2026-109618
      - CVE-2026-109619
  metadata:
    verified: true
    max-request: 1
    assessment-status: UNSUPPORTED_ACTION_REQUIRED
  tags: cve,cve2026,php,php2shell,passive,version,eol,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}"
    headers:
      Accept: text/html,*/*;q=0.1
    redirects: false
    max-size: 32768

    matchers:
      - type: dsl
        dsl:
          - |
            len(php_version) > 0 &&
            (
              compare_versions(php_version, ">= 5.4.0", "< 5.7.0") ||
              compare_versions(php_version, ">= 7.0.0", "< 7.5.0") ||
              compare_versions(php_version, ">= 8.0.0", "< 8.2.0")
            )

    extractors:
      - type: regex
        name: php_version
        part: header
        group: 1
        internal: true
        regex:
          - '(?im)^(?:X-Powered-By|X-Backend-Powered-By|Server):[^\r\n]*\bPHP(?:/|\s+)([0-9]+\.[0-9]+\.[0-9]+)\b'
          - '(?im)^X-PHP-Version:\s*([0-9]+\.[0-9]+\.[0-9]+)\b'

      - type: regex
        name: php_version
        part: body
        group: 1
        internal: true
        regex:
          - '(?is)phpinfo\(\).*?PHP\s+Version\s*(?:</[^>]+>\s*<[^>]+>\s*)?([0-9]+\.[0-9]+\.[0-9]+)\b'
          - '(?is)PHP\s+Version\s*(?:</[^>]+>\s*<[^>]+>\s*)?([0-9]+\.[0-9]+\.[0-9]+)\b.*?phpinfo\(\)'

      - type: regex
        name: detected-php-version
        part: response
        group: 1
        regex:
          - '(?im)^(?:X-Powered-By|X-Backend-Powered-By|Server):[^\r\n]*\bPHP(?:/|\s+)([0-9]+\.[0-9]+\.[0-9]+)\b'
          - '(?im)^X-PHP-Version:\s*([0-9]+\.[0-9]+\.[0-9]+)\b'
          - '(?is)phpinfo\(\).*?PHP\s+Version\s*(?:</[^>]+>\s*<[^>]+>\s*)?([0-9]+\.[0-9]+\.[0-9]+)\b'
          - '(?is)PHP\s+Version\s*(?:</[^>]+>\s*<[^>]+>\s*)?([0-9]+\.[0-9]+\.[0-9]+)\b.*?phpinfo\(\)'
